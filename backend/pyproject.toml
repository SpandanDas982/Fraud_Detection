[project]
name = "evidence_ledger"
version = "0.1.0"
description = "Evidence Ledger — multimodal evidence-packet compiler for human review"
readme = "README.md"
authors = [
    { name = "Souvik Karmakar", email = "hackgodsk112@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.7,<3",
    "boto3>=1.34,<2",
    "pymupdf>=1.24,<2",
    "reportlab>=4.1,<5",
    "sarvamai>=0.1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "boto3-stubs[dynamodb,s3,bedrock-runtime]>=1.34",
]

[project.scripts]
evidence_ledger = "evidence_ledger:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "N"]
ignore = ["S101", "E501", "S310", "UP042"]

[tool.mypy]
python_version = "3.13"
strict = true
